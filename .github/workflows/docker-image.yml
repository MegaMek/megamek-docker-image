name: Docker image
run-name: Docker image - ${{ github.event_name }}${{ inputs.version && format(' {0}', inputs.version) || '' }}

on:
  schedule:
    # Every 3 hours: build any new MegaMek release that has no image yet. Does nothing otherwise.
    # MegaMek releases land at no fixed time (the weekly run starts late, and extra ones are
    # started by hand), so this checks often and never tries to match a clock time.
    - cron: "23 */3 * * *"
    # Monday: build the current images again to pick up Java and Ubuntu security patches.
    - cron: "23 8 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: Build one release only, for example v0.51.00.1. Empty means the newest Core and Experimental
        type: string
        required: false
        default: ""
      rebuild:
        description: Build even when the image already exists
        type: boolean
        required: true
        default: false
      dry_run:
        description: Build and test only; publish nothing
        type: boolean
        required: true
        default: false
  pull_request:
    paths:
      - "Dockerfile"
      - "scripts/**"
      - ".github/workflows/docker-image.yml"

permissions:
  contents: read

concurrency:
  # One publishing run at a time. Pull requests only build, so each one gets its own group.
  group: docker-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WEEKLY_CRON: "23 8 * * 1"

jobs:
  plan:
    name: Find releases to build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      # Only for the keep-alive step below.
      actions: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the planning script
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Keep the schedule alive
        # GitHub turns off schedules in a repository with no commits for 60 days.
        # Enabling the workflow again resets that clock.
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable docker-image.yml --repo "$GITHUB_REPOSITORY"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Choose the releases to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          VERSION: ${{ inputs.version }}
          REBUILD: ${{ inputs.rebuild }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          images="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/megamek"
          mode=missing
          if [[ "$EVENT" == "pull_request" || "$DRY_RUN" == "true" ]]; then
            mode=check
            images=""
          elif [[ "$REBUILD" == "true" || "$SCHEDULE" == "$WEEKLY_CRON" ]]; then
            mode=rebuild
          fi
          python3 -B scripts/docker_release.py --mode "$mode" --images "$images" --version "$VERSION" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.release }} (${{ matrix.channel }})
    needs: plan
    if: needs.plan.outputs.has_builds == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: megamek:smoke
          build-args: |
            MM_VERSION=${{ matrix.version }}
            SENTRY_ENABLED=false
      - name: Start the server and wait for its port
        run: |
          # The check runs inside the container. From the host, Docker's port forwarder
          # accepts the connection even when the server is not listening yet.
          docker run -d --name smoke megamek:smoke
          for attempt in $(seq 1 60); do
            if [[ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]]; then
              echo "::error::The server stopped during start-up"
              docker logs smoke
              exit 1
            fi
            if docker exec smoke bash -c 'exec 3<>/dev/tcp/127.0.0.1/2346' 2>/dev/null; then
              echo "Server accepted a connection on port 2346 after ${attempt}s"
              docker logs smoke | tail -n 20
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "::error::Port 2346 never opened"
          docker logs smoke
          exit 1

      - name: Log in to GHCR
        if: matrix.tags != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish for amd64 and arm64
        if: matrix.tags != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ matrix.tags }}
          build-args: |
            MM_VERSION=${{ matrix.version }}
            SENTRY_ENABLED=true
          labels: |
            org.opencontainers.image.title=MegaMek dedicated server
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=https://megamek.org
      - name: Report what was published
        if: matrix.tags != ''
        env:
          TAGS: ${{ matrix.tags }}
          RELEASE: ${{ matrix.release }}
        run: |
          echo "### Published MegaMek $RELEASE" >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" | tr ',' '\n' | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
